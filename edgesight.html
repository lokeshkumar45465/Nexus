 let h=esc(t).replace(/`([^`]+)`/g,'<code class="rounded bg-zinc-200 px-1.5 py-0.5 text-[13px] dark:bg-zinc-700">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^- (.*)$/gm,'<li class="ml-5 list-disc">$1</li>');
 h=h.split(/\n{2,}/).map(p=>/^<li/.test(p.trim())||p.includes('\u0000')?p:'<p class="mb-2">'+p.replace(/\n/g,'<br>')+'</p>').join('');
 return h.replace(/\u0000(\d+)\u0000/g,(_,i)=>b[i])}

function SignIn(){const {users,setUser,setView}=useContext(Ctx);
 const [role,setRole]=useState('User'),[email,setEmail]=useState(''),[pw,setPw]=useState(''),[show,setShow]=useState(false),[err,setErr]=useState({}),[mode,setMode]=useState('in'),[fe,setFe]=useState(''),[fer,setFer]=useState('');

 const submit=()=>{const e={};
  if(!/^\S+@\S+\.\S+$/.test(email.trim()))e.email='Enter a valid email address.';
  if(!pw)e.pw='Enter your password.';
  if(Object.keys(e).length)return setErr(e);
  if(!DEMO)return realLogin(email.trim(),pw,role,setErr,setUser,setView);const u=users.find(x=>x.email.toLowerCase()===email.trim().toLowerCase()&&x.pw===pw);

  setUser(u);setView('app')};
 const reset=()=>{if(!/^\S+@\S+\.\S+$/.test(fe.trim()))return setFer('Enter a valid email address.');setFer('');if(!DEMO)api('/api/forgot-password','POST',{email:fe.trim()}).catch(()=>{});setMode('sent')};
 if(mode!=='in')return <AuthShell><h2 className="text-xl font-bold">{mode==='sent'?'Check your inbox':'Reset your password'}</h2>

 return <AuthShell><h2 className="text-2xl font-bold">Welcome back</h2><p className="mb-5 text-sm text-zinc-500">Choose a role and sign in.</p>

function AppShell(){
 const {user,setUser,setView,say}=useContext(Ctx);
 const [panel,setPanel]=useState('chat'),[chats,setChats]=useState(()=>DEMO?seedChats:[]),[cur,setCur]=useState(null),[side,setSide]=useState(true),[pop,setPop]=useState(null),[ren,setRen]=useState(null),[dlg,setDlg]=useState(null),[busy,setBusy]=useState(false),[col,setCol]=useState({}),[menu,setMenu]=useState(false),[settings,setSettings]=useState(false),[models,setModels]=useState(['llama3.2','mistral','GPT-4o','Claude 3.5 Sonnet']),[model,setModel]=useState('');
 useEffect(()=>{const f=()=>{setPop(null);setMenu(false)};document.addEventListener('click',f);return()=>document.removeEventListener('click',f)},[]);
 useEffect(()=>{if(DEMO)return;api('/api/conversations').then(l=>{const p=pinIds();setChats(l.map(c=>({id:c.conversation_id,t:c.title,g:groupOf(c.updated_at),p:p.includes(c.conversation_id),m:null})))}).catch(()=>{});api('/api/models').then(l=>{if(l.length)setModels(l)}).catch(()=>{})},[]);
 useEffect(()=>{try{const a=localStorage.getItem('es_avatar_'+user.id);if(a&&!user.avatar)setUser(u=>({...u,avatar:a}))}catch(e){}},[]);
 const openChat=async c=>{setCur(c.id);setPanel('chat');if(c.m===null){try{const rows=await api('/api/conversations/'+c.id);setChats(cs=>cs.map(x=>x.id===c.id?{...x,m:rows.map(toMsg)}:x))}catch(e){}}};
 const chat=chats.find(c=>c.id===cur),pc=pop&&chats.find(c=>c.id===pop.id),dc=dlg&&chats.find(c=>c.id===dlg.id);
 const send=text=>{if(!text.trim()||busy)return;
  let id=cur;const cid=cur&&!(chats.find(c=>c.id===cur)||{}).tmp?cur:null;if(!id){id=Date.now();setChats(cs=>[{id,t:text.slice(0,40),g:'Today',p:false,tmp:true,m:[]},...cs]);setCur(id)}
  const add=m=>setChats(cs=>cs.map(c=>c.id===id?{...c,m:[...(c.m||[]),m]}:c));
  add({r:'user',c:text,t:new Date().toISOString()});setBusy(true);
  if(DEMO)setTimeout(()=>{add({r:'ai',c:reply(text)});setBusy(false)},900);
  else api('/api/chat','POST',{question:text,conversation_id:cid,save_user:true,model:model||models[0]}).then(r=>{setChats(cs=>cs.map(c=>c.id===id?{...c,id:r.conversation_id,tmp:false,m:[...(c.m||[]),{r:'ai',c:r.answer}]}:c));setCur(r.conversation_id);api('/api/conversations/'+r.conversation_id).then(rows=>setChats(cs=>cs.map(c=>c.id===r.conversation_id?{...c,m:rows.map(toMsg)}:c))).catch(()=>{})}).catch(e=>add({r:'ai',c:'Sorry, that failed: '+(e.message==='Failed to fetch'?'the server is not running. Start it with start.bat or uvicorn server:app --reload.':e.message)})).finally(()=>setBusy(false))};
 const rename=(id,v)=>{v=v.trim();if(v&&!DEMO&&!(chats.find(c=>c.id===id)||{}).tmp)api('/api/conversations/'+id,'PATCH',{title:v.slice(0,100)}).catch(()=>{});if(v)setChats(cs=>cs.map(c=>c.id===id?{...c,t:v.slice(0,100)}:c));setRen(null)};
 const edit=async(i,m,text)=>{
  if(!text.trim()||busy)return;
  if(!DEMO){if(!m.id)return say('Still saving, try again in a moment.');
   try{await api('/api/conversations/'+cur+'/truncate','POST',{from_id:m.id})}catch(e){return say('Could not edit that message.')}}
  setChats(cs=>cs.map(x=>x.id===cur?{...x,m:(x.m||[]).slice(0,i)}:x));
  send(text)};
 const pin=id=>{const n=chats.map(c=>c.id===id?{...c,p:!c.p}:c);setChats(n);savePins(n)};
 const avatar=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setUser(u=>({...u,avatar:r.result}));r.readAsDataURL(f)};
 const pinned=chats.filter(c=>c.p),groups=[...(pinned.length?[['Pinned',pinned]]:[]),...[...new Set(chats.filter(c=>!c.p).map(c=>c.g))].map(g=>[g,chats.filter(c=>!c.p&&c.g===g)])];
 const Item=c=><div key={c.id} onContextMenu={e=>{e.preventDefault();e.stopPropagation();setPop({id:c.id,x:e.clientX,y:e.clientY})}} onClick={()=>openChat(c)} className={'group flex h-9 cursor-pointer items-center rounded-xl pl-2.5 pr-1 text-sm transition '+(c.id===cur&&panel==='chat'?'bg-zinc-200/80 dark:bg-zinc-800':'hover:bg-zinc-200/60 dark:hover:bg-zinc-800/70')}>
  {c.p&&<Icon n="pin" c="mr-1.5 h-3.5 w-3.5 text-zinc-400"/>}
  {ren===c.id?<input autoFocus defaultValue={c.t} className="min-w-0 flex-1 rounded border border-emerald-500 bg-transparent px-1.5 outline-none" onClick={e=>e.stopPropagation()} onBlur={e=>rename(c.id,e.target.value)} onKeyDown={e=>{if(e.key==='Enter')e.target.blur();if(e.key==='Escape')setRen(null)}}/>:<span className="flex-1 truncate">{c.t}</span>}
  <button title="Options" onClick={e=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();setPop({id:c.id,x:r.right+6,y:r.top})}} className={'grid h-7 w-7 place-items-center rounded-lg text-zinc-500 hover:text-current '+(pop&&pop.id===c.id?'':'opacity-0 group-hover:opacity-100')}><Icon n="dots"/></button></div>;
 return <div className="flex h-full">
  <aside className={'flex shrink-0 flex-col overflow-hidden bg-zinc-50 transition-all duration-300 dark:bg-zinc-950 '+(side?'w-64 p-2.5':'w-0 p-0')}>
   <button onClick={()=>{setPanel('chat');setCur(null)}} className="flex items-center gap-2.5 whitespace-nowrap rounded-xl px-2.5 py-2 text-sm font-medium transition hover:bg-zinc-200/70 dark:hover:bg-zinc-800"><Icon n="edit"/>New chat</button>
   <div className="my-2 flex-1 overflow-y-auto">{groups.map(([g,l])=><div key={g}><button onClick={()=>setCol({...col,[g]:!col[g]})} className="flex w-full items-center justify-between px-2.5 pb-1 pt-3 text-xs font-semibold text-zinc-500">{g}<Icon n="chev" c={'h-3.5 w-3.5 transition '+(col[g]?'-rotate-90':'')}/></button>{!col[g]&&l.map(Item)}</div>)}</div>
   <div className="relative border-t border-zinc-200 pt-2.5 dark:border-zinc-800">{menu&&<div onClick={e=>e.stopPropagation()} className="absolute bottom-[calc(100%+6px)] left-0 right-0 z-[70] rounded-2xl border border-zinc-700 bg-zinc-800 p-1.5 text-sm text-zinc-100 shadow-2xl">
     <div className="flex items-center gap-2.5 px-3 py-2"><Av user={user} c="h-8 w-8 text-xs"/><div className="min-w-0"><div className="truncate font-semibold">{user.name}</div><div className="truncate text-xs text-zinc-400">{user.email||user.name}</div></div></div>
     <div className="my-1 h-px bg-zinc-700"/>
     <button onClick={()=>{setMenu(false);setSettings(true)}} className="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left transition hover:bg-zinc-700"><Icon n="gear"/>Settings</button>
     <button onClick={()=>{if(!DEMO)fetch('/api/logout',{method:'POST'});setUser(null);setView('about')}} className="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left transition hover:bg-zinc-700"><Icon n="out"/>Log out</button></div>}
    {user.role==='Admin'&&<button onClick={()=>setPanel(panel==='admin'?'chat':'admin')} className="mb-2 flex w-full items-center gap-2.5 whitespace-nowrap rounded-xl px-2.5 py-2 text-sm transition hover:bg-zinc-200/70 dark:hover:bg-zinc-800"><Icon n="users"/><span className="flex-1 text-left">Admin Dashboard</span><span className={'relative h-5 w-9 rounded-full transition '+(panel==='admin'?'bg-emerald-500':'bg-zinc-300 dark:bg-zinc-700')}><span className={'absolute top-0.5 h-4 w-4 rounded-full bg-white transition-all '+(panel==='admin'?'left-[18px]':'left-0.5')}/></span></button>}
    <button onClick={e=>{e.stopPropagation();setMenu(m=>!m)}} className="flex w-full items-center gap-2.5 rounded-xl px-1.5 py-1.5 text-left transition hover:bg-zinc-200/70 dark:hover:bg-zinc-800"><Av user={user}/>
     <div className="min-w-0 flex-1"><div className="truncate text-sm font-semibold">{user.name}</div><div className="flex items-center gap-1.5"><span className={'rounded-full px-2 text-[11px] font-semibold '+(user.role==='Admin'?'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400':'bg-zinc-500/15 text-zinc-500')}>{user.role}</span></div></div>
     <Icon n="dots" c="h-4 w-4 shrink-0 text-zinc-500"/></button></div>
  </aside>
  <main className="flex min-w-0 flex-1 flex-col">
   <div className="flex items-center gap-2 px-3 py-2.5"><button onClick={()=>setSide(!side)} className="grid h-9 w-9 place-items-center rounded-lg text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800"><Icon n="panel"/></button>
    {panel==='chat'?<select value={model||models[0]} onChange={e=>setModel(e.target.value)} className="cursor-pointer rounded-lg bg-transparent px-2 py-1.5 font-semibold outline-none hover:bg-zinc-100 dark:hover:bg-zinc-800">{models.map(m=><option key={m} className="text-black">{m}</option>)}</select>:<div className="font-semibold">User Management</div>}
    <div className="flex-1"/><ThemeBtn/></div>
   {panel==='chat'?<Chat chat={chat} send={send} busy={busy} edit={edit}/>:<Admin/>}</main>
  {settings&&<SettingsModal onClose={()=>setSettings(false)}/>}
  {pop&&pc&&<div style={{left:Math.min(pop.x,innerWidth-215),top:Math.min(pop.y,innerHeight-190)}} onClick={e=>e.stopPropagation()} className="fixed z-[80] w-52 rounded-2xl border border-zinc-700 bg-zinc-800 p-1.5 text-sm text-zinc-100 shadow-2xl">
   {[['share','Share conversation',()=>setDlg({t:'share',id:pop.id})],['pin',pc.p?'Unpin':'Pin',()=>pin(pop.id)],['pencil','Rename',()=>setRen(pop.id)],['trash','Delete',()=>setDlg({t:'del',id:pop.id}),1]].map(([i,l,fn,red])=><button key={l} onClick={()=>{fn();setPop(null)}} className={'flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left transition hover:bg-zinc-700 '+(red?'text-red-400':'')}><Icon n={i}/>{l}</button>)}</div>}
  {dlg&&dc&&dlg.t==='share'&&<Modal onClose={()=>setDlg(null)}><h2 className="text-xl font-bold">Share conversation</h2><p className="my-3 text-sm text-zinc-500">Anyone with this link can view “{dc.t}”.</p>
   <div className="flex gap-2"><input readOnly className={inp} value={'https://edgesight.example/share/'+dc.id} onFocus={e=>e.target.select()}/><button className={btnP} onClick={()=>{navigator.clipboard&&navigator.clipboard.writeText('https://edgesight.example/share/'+dc.id).catch(()=>{});say('Link copied')}}>Copy</button></div></Modal>}
  {dlg&&dc&&dlg.t==='del'&&<Modal onClose={()=>setDlg(null)}><h2 className="text-xl font-bold">Delete chat?</h2><p className="my-3 text-sm text-zinc-500">“{dc.t}” will be permanently removed.</p><div className="flex justify-end gap-2"><button className={btnS} onClick={()=>setDlg(null)}>Cancel</button><button className="rounded-full bg-red-500 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-600" onClick={()=>{if(!DEMO&&!dc.tmp)api('/api/conversations/'+dc.id,'DELETE').catch(()=>{});setChats(cs=>cs.filter(c=>c.id!==dc.id));if(cur===dc.id)setCur(null);setDlg(null);say('Chat deleted')}}>Delete</button></div></Modal>}
 </div>}

const V={about:About,landing:Landing,signin:SignIn,signup:SignUp,app:AppShell};
function Root(){const {view}=useContext(Ctx);const C=V[view];return <C/>}
ReactDOM.createRoot(document.getElementById('root')).render(<Provider><Root/></Provider>);
</script>
</body>
</html>
